<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users - Nettech Help Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <i class="bi bi-shield-lock-fill text-primary"></i>
        <span>Nettech Admin</span>
      </div>
    </div>
    <ul class="sidebar-menu">
      <li class="sidebar-item">
        <a href="/admin/dashboard.html" class="sidebar-link">
          <i class="bi bi-speedometer2"></i>
          <span>Overview</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="/admin/tickets.html" class="sidebar-link">
          <i class="bi bi-ticket-perforated"></i>
          <span>Manage Tickets</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="/admin/users.html" class="sidebar-link active">
          <i class="bi bi-people"></i>
          <span>Users</span>
        </a>
      </li>
      <li class="sidebar-item mt-4">
        <a href="#" class="sidebar-link text-danger btn-logout">
          <i class="bi bi-box-arrow-right"></i>
          <span>Sign Out</span>
        </a>
      </li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-navbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-outline-secondary d-md-none" id="mobile-toggle">
          <i class="bi bi-list"></i>
        </button>
        <h5 class="mb-0 fw-bold">User Directory</h5>
      </div>

      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-outline-secondary theme-toggle-btn" title="Toggle theme">
          <i class="bi bi-moon"></i>
        </button>
        <div class="d-flex align-items-center gap-2">
          <img src="" alt="Avatar" class="avatar-img nav-user-avatar">
          <div class="d-none d-sm-block text-start">
            <div class="small fw-bold nav-user-name">Admin</div>
            <div class="text-danger fw-semibold" style="font-size: 0.72rem;">ADMINISTRATOR</div>
          </div>
        </div>
      </div>
    </header>

    <div class="container-fluid p-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
          <h3 class="fw-bold mb-1">Registered Employees</h3>
          <p class="text-muted small mb-0">List of registered user accounts and their details</p>
        </div>
        <div class="input-group input-group-sm" style="max-width: 250px;">
          <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
          <input type="text" id="user-filter-input" class="form-control" placeholder="Search user...">
        </div>
      </div>

      <div class="card-custom p-4">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light small">
              <tr>
                <th>User</th>
                <th>Email</th>
                <th>Role</th>
                <th>Department</th>
                <th>Phone</th>
                <th>Joined</th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">
                  <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                  Loading user accounts...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/guard.js"></script>
<script>
  let allUsers = [];

  document.getElementById('mobile-toggle')?.addEventListener('click', () => {
    document.querySelector('.sidebar').classList.toggle('show');
  });

  async function loadUsers() {
    const admin = await checkAuth('admin');
    if (!admin) return;

    try {
      const res = await api.get('/users');
      allUsers = res.data.users || [];
      renderUsers(allUsers);
    } catch (err) {
      showToast('Failed to load users: ' + err.message, 'error');
    }
  }

  function renderUsers(users) {
    const tbody = document.getElementById('users-tbody');
    tbody.innerHTML = '';

    if (!users.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No users found.</td></tr>`;
      return;
    }

    users.forEach(u => {
      const tr = document.createElement('tr');
      const avatarSrc = u.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=2563eb&color=fff`;
      const joinedDate = new Date(u.createdAt).toLocaleDateString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric'
      });

      tr.innerHTML = `
        <td>
          <div class="d-flex align-items-center gap-2">
            <img src="${avatarSrc}" class="avatar-img avatar-sm" alt="Avatar">
            <span class="fw-semibold user-name"></span>
          </div>
        </td>
        <td class="user-email small"></td>
        <td>
          <span class="badge ${u.role === 'admin' ? 'bg-danger' : 'bg-primary'} user-role"></span>
        </td>
        <td class="user-dept small"></td>
        <td class="user-phone small"></td>
        <td class="small text-muted">${joinedDate}</td>
      `;

      tr.querySelector('.user-name').textContent = u.name;
      tr.querySelector('.user-email').textContent = u.email;
      tr.querySelector('.user-role').textContent = u.role.toUpperCase();
      tr.querySelector('.user-dept').textContent = u.department || '-';
      tr.querySelector('.user-phone').textContent = u.phone || '-';

      tbody.appendChild(tr);
    });
  }

  document.getElementById('user-filter-input').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase().trim();
    const filtered = allUsers.filter(u =>
      (u.name && u.name.toLowerCase().includes(query)) ||
      (u.email && u.email.toLowerCase().includes(query)) ||
      (u.department && u.department.toLowerCase().includes(query))
    );
    renderUsers(filtered);
  });

  document.addEventListener('DOMContentLoaded', loadUsers);
</script>
</body>
</html>
