<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Nettech Help Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card" style="max-width: 500px;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center text-white rounded-4 mb-3 shadow" style="width: 58px; height: 58px; font-size: 1.7rem; background: var(--primary-gradient);">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h3 class="fw-bold mb-1">Create Account</h3>
      <p class="text-muted small">Register as an employee to get technical IT support</p>
    </div>

    <div id="register-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

    <form id="register-form" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label small fw-semibold">Full Name *</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="name" placeholder="Ravi Patil" required minlength="2" maxlength="50">
        </div>
        <div class="invalid-feedback" id="name-feedback">Name must be 2-50 characters.</div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold">Email Address *</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="ravi@nettech.com" required>
        </div>
        <div class="invalid-feedback" id="email-feedback">Valid company email is required.</div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="department" class="form-label small fw-semibold">Department</label>
          <select class="form-select" id="department">
            <option value="">Select Department</option>
            <option value="IT">IT Support</option>
            <option value="Sales">Sales</option>
            <option value="Marketing">Marketing</option>
            <option value="HR">Human Resources</option>
            <option value="Engineering">Engineering</option>
            <option value="Finance">Finance</option>
            <option value="Operations">Operations</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label for="phone" class="form-label small fw-semibold">Phone (10-15 digits)</label>
          <input type="tel" class="form-control" id="phone" placeholder="9876543210">
          <div class="invalid-feedback" id="phone-feedback">Phone must be 10-15 digits.</div>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label small fw-semibold">Password *</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="At least 8 chars, 1 letter, 1 number" required minlength="8">
          <button class="btn btn-outline-secondary" type="button" id="toggle-password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="form-text small">At least 8 characters with at least one letter and one number.</div>
        <div class="invalid-feedback" id="password-feedback">Password does not meet requirements.</div>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" id="btn-submit" class="btn btn-primary py-2 fw-semibold">
          <span class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
          Register Now
        </button>
      </div>
    </form>

    <div class="text-center mt-4 pt-2 border-top">
      <p class="small text-muted mb-0">
        Already have an account? <a href="/index.html" class="fw-semibold">Sign In</a>
      </p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    // Password toggle
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      toggleBtn.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
    });

    const regForm = document.getElementById('register-form');
    const regAlert = document.getElementById('register-alert');
    const submitBtn = document.getElementById('btn-submit');
    const spinner = submitBtn.querySelector('.spinner-border');

    regForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      regAlert.classList.add('d-none');
      regAlert.textContent = '';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const department = document.getElementById('department').value;
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;

      let valid = true;

      // Validation
      if (!name || name.length < 2 || name.length > 50) {
        document.getElementById('name').classList.add('is-invalid');
        valid = false;
      } else {
        document.getElementById('name').classList.remove('is-invalid');
      }

      if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
        document.getElementById('email').classList.add('is-invalid');
        valid = false;
      } else {
        document.getElementById('email').classList.remove('is-invalid');
      }

      if (phone && !/^[0-9]{10,15}$/.test(phone)) {
        document.getElementById('phone').classList.add('is-invalid');
        valid = false;
      } else {
        document.getElementById('phone').classList.remove('is-invalid');
      }

      const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;
      if (!password || !passwordRegex.test(password)) {
        document.getElementById('password').classList.add('is-invalid');
        valid = false;
      } else {
        document.getElementById('password').classList.remove('is-invalid');
      }

      if (!valid) return;

      submitBtn.disabled = true;
      spinner.classList.remove('d-none');

      try {
        const res = await api.post('/auth/register', {
          name,
          email,
          password,
          department,
          phone
        });

        api.setToken(res.data.token);
        api.setUser(res.data.user);
        showToast('Registration successful! Redirecting to dashboard...', 'success');

        setTimeout(() => {
          window.location.href = '/user/dashboard.html';
        }, 600);
      } catch (err) {
        const msg = err.data?.message || err.message || 'Registration failed';
        regAlert.textContent = msg;
        regAlert.classList.remove('d-none');
        showToast(msg, 'error');
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
