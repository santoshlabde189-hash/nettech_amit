<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nettech Help Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center text-white rounded-4 mb-3 shadow" style="width: 58px; height: 58px; font-size: 1.7rem; background: var(--primary-gradient);">
        <i class="bi bi-headset"></i>
      </div>
      <h3 class="fw-bold mb-1">Nettech Help Desk</h3>
      <p class="text-muted small">Sign in to your corporate IT support portal</p>
    </div>

    <div id="login-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="name@nettech.com" required autocomplete="email">
        </div>
        <div class="invalid-feedback" id="email-feedback">Please enter a valid email.</div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="password" class="form-label small fw-semibold mb-0">Password</label>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
          <button class="btn btn-outline-secondary" type="button" id="toggle-password" title="Show/Hide password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="invalid-feedback" id="password-feedback">Password is required.</div>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" id="btn-submit" class="btn btn-primary py-2 fw-semibold">
          <span class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
          Sign In
        </button>
      </div>
    </form>

    <div class="text-center mt-4 pt-2 border-top">
      <p class="small text-muted mb-0">
        Don't have an account? <a href="/register.html" class="fw-semibold">Create an account</a>
      </p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    // Password toggle
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      toggleBtn.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
    });

    // Check if already logged in
    (async () => {
      const token = api.getToken();
      if (token) {
        try {
          const res = await api.get('/auth/me');
          if (res.data?.user?.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else if (res.data?.user) {
            window.location.href = '/user/dashboard.html';
          }
        } catch(e) {
          api.clearToken();
        }
      }
    })();

    const loginForm = document.getElementById('login-form');
    const loginAlert = document.getElementById('login-alert');
    const submitBtn = document.getElementById('btn-submit');
    const spinner = submitBtn.querySelector('.spinner-border');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginAlert.classList.add('d-none');
      loginAlert.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      let valid = true;
      if (!email) {
        document.getElementById('email').classList.add('is-invalid');
        valid = false;
      } else {
        document.getElementById('email').classList.remove('is-invalid');
      }

      if (!password) {
        document.getElementById('password').classList.add('is-invalid');
        valid = false;
      } else {
        document.getElementById('password').classList.remove('is-invalid');
      }

      if (!valid) return;

      submitBtn.disabled = true;
      spinner.classList.remove('d-none');

      try {
        const res = await api.post('/auth/login', { email, password });
        api.setToken(res.data.token);
        api.setUser(res.data.user);
        showToast('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          if (res.data.user.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else {
            window.location.href = '/user/dashboard.html';
          }
        }, 600);
      } catch (err) {
        loginAlert.textContent = err.data?.message || err.message || 'Login failed';
        loginAlert.classList.remove('d-none');
        showToast(err.data?.message || err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
